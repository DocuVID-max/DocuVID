<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Request Information | DocuVID</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Site Styles -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="/assets/img/docuvid-logo.png" class="logo-img" loading="eager">
    </a>
  </div>
</nav>

<section class="hero section-padding text-center">
  <div class="container content-narrow">
    <h1 class="fw-bold">Request Information</h1>
    <p class="lead mt-3">
      Share a few details and we’ll show you how DocuVID can help.
    </p>
  </div>
</section>

<section class="section-padding">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">

        <form id="requestForm" class="bg-white p-4 p-md-5 border rounded">

          <input type="text" name="name" class="form-control mb-3" placeholder="Full Name" required>
          <input type="email" name="email" class="form-control mb-3" placeholder="Work Email" required>
          <input type="text" name="organisation" class="form-control mb-3" placeholder="Organisation">

          <textarea name="message" class="form-control mb-3" rows="4"
            placeholder="What documents do you want converted to video?"></textarea>

          <button type="submit" class="btn btn-primary w-100">
            Submit Request
          </button>

        </form>

      </div>
    </div>
  </div>
</section>

<footer class="py-4 mt-5 text-center text-muted">
  © 2026 DocuVID
</footer>

<script>
document.getElementById("requestForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const response = await fetch("https://formspree.io/f/mrebnqzp", {
    method: "POST",
    body: new FormData(this),
    headers: { "Accept": "application/json" }
  });

  if (response.ok) {
    window.location.href = "/thank-you.html";
  } else {
    alert("Submission failed. Please try again.");
  }
});
</script>

</body>
</html>
