<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Request Info | DocuVid</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
/* Subtle pulse animation */
@keyframes softPulse {
  0% { box-shadow: 0 0 0 0 rgba(13,110,253,0.5); }
  70% { box-shadow: 0 0 0 10px rgba(13,110,253,0); }
  100% { box-shadow: 0 0 0 0 rgba(13,110,253,0); }
}

.pulse-btn {
  animation: softPulse 2.5s infinite;
}

/* Accessibility: respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  .pulse-btn {
    animation: none;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">DocuVid</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="solutions.html">Solutions</a></li>
        <li class="nav-item"><a class="nav-link" href="samples.html">Samples</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item">
          <a class="btn btn-primary ms-lg-3 px-3 pulse-btn" href="request-info.html">
            Request Info
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- REQUEST INFO -->
<section class="py-5">
  <div class="container">
    <div class="content-narrow text-center">

      <h1 class="fw-bold">Request Information</h1>

      <p class="lead mt-3">
        Discover how DocuVid transforms complex corporate policies into
        clear, engaging video explanations your teams actually understand.
      </p>

      <form
        class="mt-4"
        action="https://formspree.io/f/mrebnqzp"
        method="POST"
      >
        <!-- Redirect to thank-you page -->
        <input type="hidden" name="_redirect" value="thank-you.html">

        <input
          class="form-control mb-3"
          name="name"
          placeholder="Your name"
          required
        >

        <input
          class="form-control mb-3"
          type="email"
          name="email"
          placeholder="Work email"
          required
        >

        <textarea
          class="form-control mb-4"
          name="message"
          rows="4"
          placeholder="Tell us about your organisation"
          required
        ></textarea>

        <button class="btn btn-primary btn-lg px-4 pulse-btn">
          Submit Request
        </button>
      </form>

    </div>
  </div>
</section>

<footer class="py-4 mt-5">
  <div class="container text-center text-muted">
    © 2026 DocuVid · Corporate Policies Explained by Video
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
