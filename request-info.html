<!-- HERO -->
<section class="section section-light text-center fade-in">
  <div class="container">
    <h1 class="fw-bold">Request More Information</h1>
    <p class="lead mt-3 col-lg-8 mx-auto">
      Learn how DocuVid helps organisations turn complex policies
      into clear, engaging video explanations.
    </p>
  </div>
</section>

<!-- FORM -->
<section class="section fade-in">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">

        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="border rounded p-4">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Work Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Organisation</label>
            <input type="text" name="company" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" rows="4" class="form-control"></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Submit Request
          </button>
        </form>

      </div>
    </div>
  </div>
</section>
