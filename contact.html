<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact DocuVID</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Site Styles -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
  <div class="container">

    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="/assets/img/docuvid-logo.png" class="logo-img" loading="eager">
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="solutions.html">Solutions</a></li>
        <li class="nav-item"><a class="nav-link" href="samples.html">Samples</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item">
          <a class="btn btn-primary ms-lg-3 px-3" href="contact.html">Request Info</a>
        </li>
      </ul>
    </div>

  </div>
</nav>

<!-- HERO -->
<section class="hero section-padding text-center">
  <div class="container content-narrow">
    <h1 class="fw-bold">Request Information</h1>
    <p class="lead mt-3">
      Tell us about your organisation and the policies you’d like transformed into engaging video training.
    </p>
  </div>
</section>

<!-- FORM -->
<section class="section-padding">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">

        <form id="contactForm" class="bg-white p-4 p-md-5 border rounded">

          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Work Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Organisation</label>
            <input type="text" name="organisation" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Message</label>
            <textarea name="message" class="form-control" rows="4" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 mt-3">
            Submit Request
          </button>

          <p class="small text-muted mt-3 text-center">
            All submissions are confidential and POPIA compliant.
          </p>

        </form>

      </div>
    </div>
  </div>
</section>

<footer class="py-4 mt-5">
  <div class="container text-center text-muted">
    © 2026 DocuVID · Corporate Policies Clearly Explained by Video
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById("contactForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const formData = new FormData(this);

  const response = await fetch("https://formspree.io/f/mrebnqzp", {
    method: "POST",
    body: formData,
    headers: { "Accept": "application/json" }
  });

  if (response.ok) {
    window.location.href = "/thank-you.html";
  } else {
    alert("Submission failed. Please try again.");
  }
});
</script>

</body>
</html>
